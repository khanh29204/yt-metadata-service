# Production: GitHub Actions build/push image ghcr.io/<repo>:latest,
# rồi SSH vào server chạy `docker compose pull && docker compose up -d`.
# Dev local: `docker compose up -d --build` (tự build thay vì pull).
services:
  api:
    image: ghcr.io/khanh29204/yt-metadata-service:latest
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      BGUTIL_URL: http://bgutil:4416
      REDIS_URL: redis://redis:6379
    # host dùng systemd-resolved (127.0.0.53) → DNS trong container hỏng nếu không override
    dns: [1.1.1.1, 8.8.8.8]
    depends_on:
      - bgutil
      - redis
    restart: always
    # Oracle x86 Always Free (E2.1.Micro: 1 OCPU + 1GB RAM, chia sẻ cho cả stack).
    # mem_limit là OOM guard bắt buộc: không có nó, burst 30 job yt-dlp/ffmpeg
    # đồng thời kill luôn node (đã test — xem MAX_CONCURRENCY trong server.ts).
    cpus: 0.5
    mem_limit: 448m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/resolve',{method:'HEAD'}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PO token provider (BotGuard) cho yt-dlp — xem github.com/Brainicism/bgutil-ytdlp-pot-provider
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    dns: [1.1.1.1, 8.8.8.8]
    restart: always
    cpus: 0.2
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - ./redis_data:/data
    restart: always
    cpus: 0.1
    mem_limit: 64m
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"