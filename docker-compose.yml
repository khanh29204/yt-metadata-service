services:
  yt-metadata-service:
    image: ghcr.io/khanh29204/yt-metadata-service:latest
    container_name: yt_metadata_service
    ports:
      - '3001:3001'
    restart: always
    # env file (nếu cần cấu hình thêm)
    env_file:
      - .env

  # Cron 4h sáng: tự nâng yt-dlp trong container (YouTube chặn bản cũ)
  updater:
    image: docker:cli
    container_name: yt_metadata_updater
    restart: always
    depends_on:
      - yt-metadata-service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # múi giờ cho crond trong container
      TZ: Asia/Ho_Chi_Minh
    entrypoint: ["sh", "-c", "echo '0 4 * * * docker exec yt_metadata_service uv pip install --python .venv/bin/python --no-cache -U yt-dlp && docker restart yt_metadata_service' | crontab - && crond -f -l 2"]
